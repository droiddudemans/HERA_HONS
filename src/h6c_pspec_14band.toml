[Options]
makeflow_type = "analysis"
source_script = "~/.bashrc"
base_mem = 15500
base_cpu = 1
timeout = "48h"
path_to_do_scripts = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/src/task_scripts"
conda_env = "honours"
batch_system = "slurm"

[NOTEBOOK_OPTS]
toml_file = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/src/h6c_pspec_14band.toml"  # this file
kernel = ""

[NOTEBOOK_TEMPLATE_OPTS]
# Directory holding OUR copies of the notebooks used by this makeflow:
#   delay_filtering_analysis_and_fitting, single_baseline_postprocessing_and_pspec,
#   power_spectrum_summary, signal_loss_analysis (all .ipynb)
nb_template_dir = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/src/HONS/notebooks"

[GLOBAL_OPTS]
FM_low_freq = 87.5  # in MHz
FM_high_freq = 108.0  # in MHz
eigenval_cutoff = 1e-12
auto_fr_spectrum_file = '/lustre/aoc/projects/hera/zmartino/hera_frf/spectra_cache/spectra_cache_hera_auto.h5'
min_samp_frac = 0.05  # TODO: this should probably be 0.1, but let's try this for now
BAND_STR = "50.2~62.2,63.3~73.5,74.6~85.4,117.3~124.4,125.4~136.2,159.3~169.9,171.9~181.1,212.3~220.6"
LST_MIN = -1.5  # i.e. 22.5 hours
LST_MAX = 15.5

[AUTO_SMOOTH_OPTS]  # Shared by single_lststack_baseline_pI_FRF_SNR and single_lststack_baseline_scaffolded_and_feathered_inpainter
auto_inpaint_delay = 50.0  # ns, for smooth auto model
auto_gauss_fit_buffer_cut = 1e-3
auto_blacklist_smoother_factor = 0.5
auto_blacklist_rel_err_thresh = 1.0
auto_blacklist_downweight = 0.1
auto_cg_tol = 1e-6
auto_cg_iter_lim = 500

[FRF_SNR_OPTS]  # Read directly by single_lststack_baseline_pI_FRF_SNR notebook
filter_delay = 1000.0  # ns
xtalk_frate = 0.025  # mHz
skip_fr0_overlap_baselines = false
fr_spectra_file = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/src/spectra_cache_hera_core.h5"
fr_quantile_low = 0.05
fr_quantile_high = 0.95

[LSTSTACK_RFI_ROUND_6_OPTS]
z_thresh = 8
ws_z_thresh = 4
avg_z_thresh = 2
max_freq_flag_frac = 0.25
max_time_flag_frac = 0.50
time_conv_size = 3600  # in seconds

[SINGLE_LSTSTACK_BASELINE_REINPAINT_OPTS]  # Read directly by single_lststack_baseline_scaffolded_and_feathered_inpainter notebook
inpaint_delay = 1000.0  # in ns
inpaint_width_factor = 0.5
inpaint_zero_dist_weight = 1e-2
apply_round_6_flags = false  # if false, only re-inpaint pixels with nsamples == 0 (skip round-6 flag waterfalls) # TODO this should be true eventually
apply_abscal_correction = true  # if true, multiply cross visibilities by upsampled SSM gleam/orig ratio before writing
abscal_smooth_delay = 33.333  # ns; delay half-width for the 2D DPSS smoothing of the abscal ratio
abscal_smooth_fringe_rate = 0.0001  # Hz; fringe-rate half-width for the 2D DPSS smoothing of the abscal ratio

[POSTPROCESS_AND_PSPEC_OPTS]
# General Options
PLOT = true
SAVE_RESULTS = true

ALREADY_INPAINTED = true
PERFORM_INPAINT = false
INPAINT_MIN_DLY = 500.0
INPAINT_HORIZON = 1.0
INPAINT_STANDOFF = 0.0
INPAINT_EIGENVAL_CUTOFF = 1e-12

# PERFORM_DLY_FILT is deliberately not set here: every baseline is processed twice, and the task script sets it per run
# (unfiltered: False; filtered: True, with the half-width / eigenvalue cutoff predicted from the fit).
DLY_FILT_MIN_DLY = 150.0
DLY_FILT_HORIZON = 1.0
DLY_FILT_STANDOFF = 0.0
# Only used when running the notebook by hand: the filtered makeflow run replaces this with the value predicted from the fit.
DLY_FILT_EIGENVAL_CUTOFF = 1e-12

USE_BAND_AVG_NSAMPLES = true
FM_CUT_FREQ = 100000000.0
PIXEL_FLAG_CUT = 0.0
CHANNEL_FLAG_CUT = 0.0

# Where the single-baseline pspecs and the merged pspecs go:
#   <PSPEC_OUT_DIR>/{filtered,unfiltered}/BLPAIR_*/   one directory per baseline file
#   <PSPEC_OUT_DIR>/merged/{filtered,unfiltered}/     one merged file each
PSPEC_OUT_DIR = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/output/pspec_out"

# Temporal options
INTEGRATION_FLAG_CUT = 0.2
NINTERLEAVE = 4
XTALK_FR = 0.01
FR_SPECTRA_FILE = "/lustre/aoc/projects/hera/zmartino/hera_frf/spectra_cache/spectra_cache_hera_core.h5"
FR_QUANTILE_LOW = 0.05
FR_QUANTILE_HIGH = 0.95
FR_EIGENVAL_CUTOFF = 1e-12
TARGET_AVERAGING_TIME = 300

LST_MIN = 1.25
LST_MAX = 5.75

# pspec options
EFIELD_HEALPIX_BEAM_FILE = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/src/NF_HERA_Vivaldi_efield_beam_healpix.fits"
TAPER = "bh"
INCLUDE_INTERLEAVE_AUTO_PS = false
STORE_WINDOW_FUNCTIONS = false

[DELAY_FILTERING_FITTING_OPTIONS]  # Read by delay_filtering_analysis_and_fitting (writes the fit) and single_baseline_postprocessing_and_pspec (reads it)
FIT_REQUIRES_MAX_SIGNAL_LOSS_BEYOND_HORIZON = 0.03
FIT_RESULTS_OUT = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/output/delay_filtering_fit_results"

# The fit itself. The fitting job writes it here and every single-baseline job reads it from here.
# If this file already exists the fitting job is skipped entirely (no datasets are opened, nothing is fitted):
# put an existing fit_result.json here to reuse it, or delete it to refit.
FIT_RESULT_FILE = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/output/delay_filtering_fit_results/validation/eor_only/fit_testing/fit_results/fit_result.json"

FIT_DATA = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/HERA_HONS/data"
FIT_ON_EXPERIMENTAL = false
# Setting below to false means full validation data (including fg and systematics)
FIT_ON_EOR_ONLY = true

[POWER_SPECTRUM_SUMMARY_OPTS]  # Read by power_spectrum_summary and signal_loss_analysis (which must use the same bands and wedge buffer)
SUMMARY_OUT_DIR = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/output/pspec_out/summary"  # gets unfiltered/ and filtered/ subfolders
BANDS_TO_USE = "1,2,3,4,5,6,7,8"  # 1-indexed into BAND_STR (GLOBAL_OPTS), which currently defines 8 bands
WEDGE_BUFFER_NS = 500.0
MAX_FRF_SIGNAL_LOSS = 0.1
WINDOW_FUNCTION_FILEGLOB = "/lustre/aoc/projects/hera/kfchen/H6C/inpainting/window_function/exact_window-spw??-wf.npy"
KBINS_DK_MULTIPLIER = 4.0         # How wide the |k|-bins are, multiplied by natural delay resolution
KBINS_KSTART_MULTIPLIER = 0.625   # The first |k| bin center is at KBINS_DK_MULTIPLIER*dk*KBINS_KSTART_MULTIPLIER
KBINS_MAXK_HMPC = 2.5             # The maximum k to include in the spherical averages

[SIGNAL_LOSS_OPTS]  # Read by signal_loss_analysis
SIGNAL_LOSS_OUT_DIR = "/lustre/aoc/projects/hera/Validation/delay_filtering_tests/output/pspec_out/signal_loss"
MIN_SNR = 0.0       # include a pixel/bin only if |Delta^2_unfilt| > MIN_SNR * 1sigma
MAX_ERR = 1e20      # error bars above this count as unconstrained

[WorkFlow]
actions = [
    "DELAY_FILTERING_ANALYSIS_AND_FITTING",
    "SINGLE_BASELINE_POSTPROCESSING_AND_PSPEC",
    "MERGE_SINGLE_BASELINE_FILES",
    "POWER_SPECTRUM_SUMMARY",
    "SIGNAL_LOSS_ANALYSIS",
]

[DELAY_FILTERING_ANALYSIS_AND_FITTING]
# Runs once for the whole dataset (chunk_size = "all"). Writes fit_result.json under FIT_RESULTS_OUT.
# Skipped (exits at once) if FIT_RESULT_FILE already exists.
# args: toml_file, conda_env, nb_template_dir, fit_results_out, fit_result_file
args = [
    "${NOTEBOOK_OPTS:toml_file}",
    "${Options:conda_env}",
    "${NOTEBOOK_TEMPLATE_OPTS:nb_template_dir}",
    "${DELAY_FILTERING_FITTING_OPTIONS:FIT_RESULTS_OUT}",
    "${DELAY_FILTERING_FITTING_OPTIONS:FIT_RESULT_FILE}",
]
chunk_size = "all"
mem = 32000

[SINGLE_BASELINE_POSTPROCESSING_AND_PSPEC]
# One job per baseline file. Each job writes one unfiltered and one filtered pspec, and cannot start until the fit exists.
# args: input file, toml_file, conda_env, nb_template_dir, pspec_out_dir
prereqs = [
    "DELAY_FILTERING_ANALYSIS_AND_FITTING",
]
prereq_chunk_size = "all"
args = [
    "{basename}",
    "${NOTEBOOK_OPTS:toml_file}",
    "${Options:conda_env}",
    "${NOTEBOOK_TEMPLATE_OPTS:nb_template_dir}",
    "${POSTPROCESS_AND_PSPEC_OPTS:PSPEC_OUT_DIR}",
]

[MERGE_SINGLE_BASELINE_FILES]
# Merges all filtered pspecs into one file and all unfiltered pspecs into one file.
# args: pspec_out_dir, conda_env
prereqs = [
    "SINGLE_BASELINE_POSTPROCESSING_AND_PSPEC",
]
chunk_size = "all"
prereq_chunk_size = "all"
args = [
    "${POSTPROCESS_AND_PSPEC_OPTS:PSPEC_OUT_DIR}",
    "${Options:conda_env}",
]
mem = 100000

[POWER_SPECTRUM_SUMMARY]
# Runs power_spectrum_summary.ipynb on the merged unfiltered pspec, then on the merged filtered one.
# args: toml_file, conda_env, nb_template_dir, pspec_out_dir, summary_out_dir
prereqs = [
    "MERGE_SINGLE_BASELINE_FILES",
]
chunk_size = "all"
prereq_chunk_size = "all"
args = [
    "${NOTEBOOK_OPTS:toml_file}",
    "${Options:conda_env}",
    "${NOTEBOOK_TEMPLATE_OPTS:nb_template_dir}",
    "${POSTPROCESS_AND_PSPEC_OPTS:PSPEC_OUT_DIR}",
    "${POWER_SPECTRUM_SUMMARY_OPTS:SUMMARY_OUT_DIR}",
]
mem = 64000

[SIGNAL_LOSS_ANALYSIS]
# Compares the filtered and unfiltered summaries (signal_loss_analysis.ipynb).
# args: toml_file, conda_env, nb_template_dir, pspec_out_dir, summary_out_dir, signal_loss_out_dir
prereqs = [
    "POWER_SPECTRUM_SUMMARY",
]
chunk_size = "all"
prereq_chunk_size = "all"
args = [
    "${NOTEBOOK_OPTS:toml_file}",
    "${Options:conda_env}",
    "${NOTEBOOK_TEMPLATE_OPTS:nb_template_dir}",
    "${POSTPROCESS_AND_PSPEC_OPTS:PSPEC_OUT_DIR}",
    "${POWER_SPECTRUM_SUMMARY_OPTS:SUMMARY_OUT_DIR}",
    "${SIGNAL_LOSS_OPTS:SIGNAL_LOSS_OUT_DIR}",
]
